<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        :root {
            --color-page: #f4f7fb;
            --color-text: #263445;
            --color-heading: #17324d;
            --color-primary: #245b78;
            --color-accent: #67a9ad;
            --color-muted: #526477;
            --color-surface: #fff;
            --color-on-primary: #fff;
            --color-shadow: rgba(0, 0, 0, 0.1);

            --space-0: 0;
            --space-1: 8px;
            --space-2: 20px;
            --space-3: 32px;
            --space-4: 40px;

            --radius-card: 12px;
            --shadow-card: 0 8px 20px var(--color-shadow);
        }

        body {
            margin: var(--space-0);
            font-family: "DM Sans", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background: var(--color-page);
            color: var(--color-text);
        }

        h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1.15;
            color: var(--color-heading);
            text-align: center;
            margin: var(--space-3) var(--space-0) var(--space-0);
        }

        #hero {
            background: linear-gradient(135deg, var(--color-primary), var(--color-accent));
            padding: var(--space-4) var(--space-2);
            text-align: center;
            color: var(--color-on-primary);
        }

        h2 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 1.5rem;
            line-height: 1.3;
            color: var(--color-primary);
            margin: var(--space-0) var(--space-0) var(--space-1);
        }

        .card {
            width: 260px;
            background: var(--color-surface);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-card);
            padding: var(--space-2);
            margin: var(--space-2) auto;
        }

        .card p {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--color-muted);
            margin: var(--space-0);
        }
    </style>
</head>

<body>
    <h1 id="hero">Welcome to the Selector Demo</h1>

    <div class="card">
        <h2>Card Section</h2>
        <p>This card uses the .card class selector.</p>
    </div>

    <div class="card">
        <h2>Another Card</h2>
        <p>This is another element styled by the same class selector.</p>
    </div>
</body>
</html>
