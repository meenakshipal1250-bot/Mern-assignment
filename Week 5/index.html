<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            background: #f4f7fb;
            color: #263445;
        }

        h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: clamp(2rem, 5vw, 3.25rem);
            line-height: 1.15;
            color: #17324d;
            text-align: center;
            margin: 32px 0 0;
        }

        #hero {
            background: linear-gradient(135deg, #245b78, #67a9ad);
            padding: 40px 20px;
            text-align: center;
            color: #fff;
        }

        h2 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 1.5rem;
            line-height: 1.3;
            color: #245b78;
            margin: 0 0 8px;
        }

        .card {
            width: 260px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
        }

        .card p {
            font-size: 1rem;
            line-height: 1.7;
            color: #526477;
            margin: 0;
        }
    </style>
</head>

<body>
    <h1 id="hero">Welcome to the Selector Demo</h1>

    <div class="card">
        <h2>Card Section</h2>
        <p>This card uses the .card class selector.</p>
    </div>

    <div class="card">
        <h2>Another Card</h2>
        <p>This is another element styled by the same class selector.</p>
    </div>
</body>
</html>
